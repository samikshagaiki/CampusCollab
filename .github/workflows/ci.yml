
name: CampusCollab CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ci-only-campuscollab-secret-key-12345678901234567890

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: campuscollab
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d campuscollab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        working-directory: campuscollab
        run: chmod +x mvnw && ./mvnw -B "-Duser.timezone=Asia/Kolkata" test

